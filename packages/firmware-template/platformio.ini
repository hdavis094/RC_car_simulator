[env:esp32dev]
; Arduino-ESP32 3.2.1, ESP-IDF 5.4.2 (pinned pioarduino release).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
  pololu/VL53L0X@1.3.1
  madhephaestus/ESP32Servo@3.2.1
  electroniccats/MPU6050@1.4.5
  bblanchon/ArduinoJson@7.4.2
