name: CI

on:
  push:
    branches: [main, 'ws/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb clang clang-format

      - run: pnpm install --frozen-lockfile

      - name: Toolchain
        run: |
          node --version
          pnpm --version
          for cxx in g++ clang++ c++; do command -v "$cxx" >/dev/null && "$cxx" --version | head -n 1; done
          command -v clang-format >/dev/null && clang-format --version || echo "clang-format: not installed"

      - name: pnpm verify (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm verify

      - name: pnpm verify (macOS)
        if: runner.os == 'macOS'
        run: pnpm verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
